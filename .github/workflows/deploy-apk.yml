name: Build and Deploy BarBud APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barbud_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk barbud.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: barbud-apk
          path: barbud_frontend/barbud.apk
          retention-days: 7

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: barbud-apk
          path: dist

      - name: Publish to nginx web root
        run: |
          install -m 644 dist/barbud.apk /var/www/barbud/barbud.apk
          install -m 644 website/downloadPage.html /var/www/barbud/index.html
          install -m 644 website/downloadApp.html /var/www/barbud/downloadApp.html